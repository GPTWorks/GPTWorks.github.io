<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>God's Profound Truth | GPTWorks</title>
  <meta name="description" content="Offline Bible study prompts and notes from GPTWorks. Your notes stay in this browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,600&family=Syne:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../assets/cosmos/tools.css">
</head>
<body>
  <header class="tool-header">
    <a class="brand" href="../"><img src="../images/gptworks-logo.png" alt="" width="36" height="36"> GPTWorks</a>
    <nav aria-label="Secondary">
      <a href="index.html">Tools</a>
      <a href="../#contact">Contact</a>
    </nav>
  </header>
  <main class="tool-main">
    <p class="kicker">Study</p>
    <h1>God's Profound Truth</h1>
    <p class="lede">A quiet worksheet for scripture study — context, meaning, and what it asks of you. Notes stay on this device.</p>

    <section class="panel">
      <label for="passage">Passage or question</label>
      <textarea id="passage" rows="3" placeholder="e.g. Psalm 23, or What does 'neighbor' mean in the Good Samaritan?"></textarea>
      <label for="notes">Your notes</label>
      <textarea id="notes" rows="6" placeholder="Historical setting, key words, questions, prayer…"></textarea>
      <div class="actions">
        <button class="primary" type="button" id="guideBtn">Show study prompts</button>
        <button class="ghost" type="button" id="saveBtn">Save notes</button>
        <button class="ghost" type="button" id="downloadBtn">Download</button>
      </div>
      <div id="output" class="result" style="margin-top:16px" hidden></div>
    </section>

    <p class="note">This tool does not call an AI API from the browser. It is a structured study aid.</p>
    <div class="actions">
      <a class="button ghost" href="index.html">All tools</a>
      <a class="button ghost" href="../">Back to GPTWorks</a>
    </div>
  </main>
  <footer class="tool-footer"><p>&copy; GPTWorks. Free to use.</p></footer>
  <script>
    const KEY = "gptworks-gods-profound-truth";
    const passage = document.getElementById("passage");
    const notes = document.getElementById("notes");
    const output = document.getElementById("output");
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      if (saved.passage) passage.value = saved.passage;
      if (saved.notes) notes.value = saved.notes;
    } catch {}

    document.getElementById("guideBtn").addEventListener("click", () => {
      const topic = passage.value.trim() || "this passage";
      output.hidden = false;
      output.innerHTML = `
        <p><strong>Study prompts for ${topic.replace(/</g, "&lt;")}</strong></p>
        <ul class="list">
          <li>Who is speaking, and to whom?</li>
          <li>What is happening in the surrounding chapter?</li>
          <li>Which words feel heavy or repeated?</li>
          <li>What does this ask you to believe, stop, or begin?</li>
          <li>How would you explain it in one plain sentence?</li>
        </ul>`;
    });
    document.getElementById("saveBtn").addEventListener("click", () => {
      localStorage.setItem(KEY, JSON.stringify({ passage: passage.value, notes: notes.value, when: new Date().toISOString() }));
      document.getElementById("saveBtn").textContent = "Saved";
      setTimeout(() => { document.getElementById("saveBtn").textContent = "Save notes"; }, 1200);
    });
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const text = `God's Profound Truth\n\nPassage:\n${passage.value}\n\nNotes:\n${notes.value}\n`;
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "gods-profound-truth.txt"; a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
