<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmic Drift | GPTWorks</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .demo { background: #f8f9fa; padding: 1.5em; border-radius: 8px; margin: 1em 0; text-align: center; }
        #canvas { border: 1px solid #ccc; background: #111; margin: 1em auto; display: block; }
        button { margin: 0.5em; padding: 0.5em 1em; background: #4a90e2; color: white; border: none; cursor: pointer; }
        #score { font-size: 1.2em; margin: 0.5em; }
        .views { margin: 1em 0; font-size: 0.95em; color: #555; text-align: left; }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <section class="wrapper style3 fade-up">
            <div class="inner">
                <h1>Cosmic Drift</h1>
                <p>Space exploration game and experience.</p>
                <p class="views">Views: <span id="viewCount">...</span></p>

                <div class="demo">
                    <h2>Try the Demo</h2>
                    <p>Click the ship to drift and score points.</p>
                    <canvas id="canvas" width="400" height="200"></canvas>
                    <div id="score">Score: 0</div>
                    <button onclick="reset()">Reset</button>
                </div>

                <p><small>Very simple click-to-score demo. Full game coming later.</small></p>

                <ul class="actions">
                    <li><a href="../" class="button">Back to GPTWorks</a></li>
                </ul>
            </div>
        </section>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let x = 200, y = 100;
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, 400, 200);
            ctx.fillStyle = '#4a90e2';
            ctx.beginPath();
            ctx.arc(x, y, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = '12px sans-serif';
            ctx.fillText('Ship', x - 15, y + 30);
        }
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
            score += 10;
            document.getElementById('score').textContent = 'Score: ' + score;
            draw();
        });
        function reset() { score = 0; x = 200; y = 100; document.getElementById('score').textContent = 'Score: 0'; draw(); }
        draw();

        fetch('https://countapi.mileshilliard.com/api/v1/hit/gptworks-cosmic-drift')
            .then(r => r.json())
            .then(d => { document.getElementById('viewCount').textContent = d.value || '0'; })
            .catch(() => { document.getElementById('viewCount').textContent = '—'; });
    </script>
</body>
</html>
