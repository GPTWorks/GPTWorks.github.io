<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Afternumber | GPTWorks</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        .demo { background: #f8f9fa; padding: 1.5em; border-radius: 8px; margin: 1em 0; }
        input, button { margin: 0.3em 0; padding: 0.5em; width: 100%; max-width: 400px; }
        button { background: #4a90e2; color: white; border: none; cursor: pointer; }
        #result { margin-top: 1em; padding: 1em; background: white; border-left: 3px solid #4a90e2; }
        .views { margin: 1em 0; font-size: 0.95em; color: #555; }
    </style>
</head>
<body class="is-preload">
    <div id="wrapper">
        <section class="wrapper style3 fade-up">
            <div class="inner">
                <h1>Afternumber</h1>
                <p>Forensic switchboard for analyzing spoofed texts and numbers.</p>
                <p class="views">Views: <span id="viewCount">...</span></p>

                <div class="demo">
                    <h2>Try the Demo</h2>
                    <label>Enter a phone number or text snippet</label>
                    <input type="text" id="input" placeholder="e.g. +1-555-123-4567 or 'Your account is locked, call this number'">
                    <button onclick="analyze()">Analyze</button>
                    <div id="result"></div>
                </div>

                <p><small>Simple pattern check only. Not a full forensic tool.</small></p>

                <ul class="actions">
                    <li><a href="../" class="button">Back to GPTWorks</a></li>
                </ul>
            </div>
        </section>
    </div>
    <script>
        function analyze() {
            const val = document.getElementById('input').value.trim();
            const result = document.getElementById('result');
            if (!val) { result.innerHTML = 'Enter something to analyze.'; return; }
            let flags = [];
            if (/\+?1?[-.\s]?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/.test(val)) flags.push('Looks like a US phone number');
            if (/urgent|locked|verify|suspended|prize|winner|call now/i.test(val)) flags.push('Contains common spoof/scam keywords');
            if (val.length < 10) flags.push('Very short input');
            result.innerHTML = flags.length ? '<strong>Flags:</strong><br>' + flags.join('<br>') : 'No obvious red flags in this simple check.';
        }

        fetch('https://countapi.mileshilliard.com/api/v1/hit/gptworks-afternumber')
            .then(r => r.json())
            .then(d => { document.getElementById('viewCount').textContent = d.value || '0'; })
            .catch(() => { document.getElementById('viewCount').textContent = '—'; });
    </script>
</body>
</html>
